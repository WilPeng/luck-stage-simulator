name: Deploy Application

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ========================================
      # 1. Checkout
      # ========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ========================================
      # 2. Setup pnpm
      # ========================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # ========================================
      # 3. Setup Node.js
      # ========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # ========================================
      # 4. Install frontend dependencies
      # ========================================
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # ========================================
      # 5. Build frontend
      # ========================================
      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      # ========================================
      # 6. Pack frontend
      # ========================================
      - name: Pack frontend
        run: |
          tar -czf frontend-dist.tar.gz \
            -C frontend/dist .

      # ========================================
      # 7. Pack backend
      # ========================================
      - name: Pack backend
        run: |
          tar -czf backend.tar.gz \
            --exclude='backend/node_modules' \
            --exclude='backend/.env' \
            --exclude='backend/uploads' \
            --exclude='backend/*.log' \
            backend

      # ========================================
      # 8. Upload frontend package
      # ========================================
      - name: Upload frontend package
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "frontend-dist.tar.gz"
          target: "/tmp"

      # ========================================
      # 9. Upload backend package
      # ========================================
      - name: Upload backend package
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "backend.tar.gz"
          target: "/tmp"

      # ========================================
      # 10. Deploy application
      # ========================================
      - name: Deploy application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            set -e

            echo "================================"
            echo "Deploy Frontend"
            echo "================================"

            rm -rf /tmp/luck-stage-frontend
            mkdir -p /tmp/luck-stage-frontend

            tar -xzf /tmp/frontend-dist.tar.gz \
              -C /tmp/luck-stage-frontend

            echo "Replacing frontend files..."

            rm -rf /var/www/luck-stage-simulator/*
            cp -r /tmp/luck-stage-frontend/* \
              /var/www/luck-stage-simulator/

            chown -R nginx:nginx \
              /var/www/luck-stage-simulator

            echo "Frontend deployed."

            echo "================================"
            echo "Deploy Backend"
            echo "================================"

            rm -rf /tmp/luck-stage-backend
            mkdir -p /tmp/luck-stage-backend

            tar -xzf /tmp/backend.tar.gz \
              -C /tmp/luck-stage-backend

            echo "Cleaning old backend source..."

            find /opt/luck-stage-simulator/backend \
              -mindepth 1 \
              -maxdepth 1 \
              ! -name '.env' \
              ! -name 'uploads' \
              ! -name 'node_modules' \
              -exec rm -rf {} +

            echo "Copying new backend source..."

            cp -r /tmp/luck-stage-backend/backend/. \
              /opt/luck-stage-simulator/backend/

            cd /opt/luck-stage-simulator/backend

            echo "Installing backend dependencies..."

            if [ -f package-lock.json ]; then
              npm ci --omit=dev
            else
              npm install --omit=dev
            fi

            echo "Backend dependencies installed."

            echo "================================"
            echo "Restart Backend"
            echo "================================"

            echo "Restarting luck-stage-backend with admin PM2..."

            sudo -u admin \
              PM2_HOME=/home/admin/.pm2 \
              pm2 restart luck-stage-backend --update-env

            echo "================================"
            echo "PM2 Status"
            echo "================================"

            sudo -u admin \
              PM2_HOME=/home/admin/.pm2 \
              pm2 status luck-stage-backend

            echo "Backend process restarted."

            echo "================================"
            echo "Check Backend"
            echo "================================"

            echo "Waiting for backend to listen on port 3000..."

            BACKEND_READY=0

            for i in $(seq 1 40); do
              # 任意 HTTP 返回码都算就绪（不再要求 2xx，避免根路径非 200 时误判）
              code=$(curl -s -o /dev/null -w '%{http_code}' \
                --max-time 3 \
                http://127.0.0.1:3000/ 2>/dev/null || true)

              if [ -n "$code" ] && [ "$code" != "000" ]; then
                echo "Backend is ready (HTTP $code)."
                BACKEND_READY=1
                break
              fi

              # 端口已监听同样视为就绪（Mongo Atlas 连接较慢时先监听后可用）
              if ss -lnt 2>/dev/null | grep -q ':3000'; then
                echo "Backend port 3000 is listening."
                BACKEND_READY=1
                break
              fi

              echo "Backend not ready yet... attempt $i/40"
              sleep 3
            done

            if [ "$BACKEND_READY" -ne 1 ]; then
              echo "================================"
              echo "Backend Failed To Start"
              echo "================================"

              echo "PM2 Status:"
              sudo -u admin \
                PM2_HOME=/home/admin/.pm2 \
                pm2 status luck-stage-backend

              echo "================================"
              echo "PM2 Logs"
              echo "================================"

              sudo -u admin \
                PM2_HOME=/home/admin/.pm2 \
                pm2 logs luck-stage-backend \
                --lines 80 \
                --nostream

              echo "================================"
              echo "Port 3000 Check"
              echo "================================"

              ss -lntp | grep ':3000' || true

              exit 1
            fi

            echo "Backend health check passed."

            echo "================================"
            echo "Reload Nginx"
            echo "================================"

            nginx -t

            systemctl reload nginx

            echo "Nginx reloaded."

            echo "================================"
            echo "Cleanup"
            echo "================================"

            rm -rf /tmp/luck-stage-frontend
            rm -rf /tmp/luck-stage-backend

            rm -f /tmp/frontend-dist.tar.gz
            rm -f /tmp/backend.tar.gz

            echo "Temporary files cleaned."

            echo "================================"
            echo "DEPLOY SUCCESS"
            echo "================================"
