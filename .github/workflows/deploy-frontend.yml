name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Pack frontend
        run: tar -czf frontend-dist.tar.gz -C frontend/dist .

      - name: Upload frontend package
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "frontend-dist.tar.gz"
          target: "/tmp"

      - name: Deploy frontend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            rm -rf /tmp/luck-stage-frontend
            mkdir -p /tmp/luck-stage-frontend

            tar -xzf /tmp/frontend-dist.tar.gz -C /tmp/luck-stage-frontend

            rm -rf /var/www/luck-stage-simulator/*
            cp -r /tmp/luck-stage-frontend/* /var/www/luck-stage-simulator/

            chown -R nginx:nginx /var/www/luck-stage-simulator

            nginx -t
            systemctl reload nginx

            rm -rf /tmp/luck-stage-frontend
            rm -f /tmp/frontend-dist.tar.gz