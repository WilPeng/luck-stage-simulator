name: Deploy Application

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Pack frontend
        run: tar -czf frontend-dist.tar.gz -C frontend/dist .

      - name: Pack backend
        run: |
          tar -czf backend.tar.gz \
            --exclude='backend/node_modules' \
            --exclude='backend/.env' \
            --exclude='backend/uploads' \
            --exclude='backend/*.log' \
            backend

      - name: Upload frontend package
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "frontend-dist.tar.gz"
          target: "/tmp"

      - name: Upload backend package
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "backend.tar.gz"
          target: "/tmp"

      - name: Deploy application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            echo "================================"
            echo "Deploy Frontend"
            echo "================================"

            rm -rf /tmp/luck-stage-frontend
            mkdir -p /tmp/luck-stage-frontend

            tar -xzf /tmp/frontend-dist.tar.gz \
              -C /tmp/luck-stage-frontend

            rm -rf /var/www/luck-stage-simulator/*
            cp -r /tmp/luck-stage-frontend/* \
              /var/www/luck-stage-simulator/

            chown -R nginx:nginx \
              /var/www/luck-stage-simulator

            echo "Frontend deployed."

            echo "================================"
            echo "Deploy Backend"
            echo "================================"

            rm -rf /tmp/luck-stage-backend
            mkdir -p /tmp/luck-stage-backend

            tar -xzf /tmp/backend.tar.gz \
              -C /tmp/luck-stage-backend

            rsync -a \
              --delete \
              --exclude='.env' \
              --exclude='uploads/' \
              --exclude='node_modules/' \
              --exclude='*.log' \
              /tmp/luck-stage-backend/backend/ \
              /opt/luck-stage-simulator/backend/

            cd /opt/luck-stage-simulator/backend

            echo "Installing backend dependencies..."

            if [ -f package-lock.json ]; then
              npm ci --omit=dev
            else
              npm install --omit=dev
            fi

            echo "Restarting backend..."

            pm2 restart luck-stage-backend --update-env

            echo "Checking backend..."

            sleep 2

            curl -f http://127.0.0.1:3000/ || exit 1

            echo "Backend deployed."

            echo "================================"
            echo "Reload Nginx"
            echo "================================"

            nginx -t
            systemctl reload nginx

            echo "================================"
            echo "Cleanup"
            echo "================================"

            rm -rf /tmp/luck-stage-frontend
            rm -rf /tmp/luck-stage-backend
            rm -f /tmp/frontend-dist.tar.gz
            rm -f /tmp/backend.tar.gz

            echo "================================"
            echo "DEPLOY SUCCESS"
            echo "================================"
